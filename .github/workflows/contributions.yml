name: Calendário de contribuições
on:
  push:
    branches: [main, feature/profile-matrix-v5]
    paths: ['.github/workflows/contributions.yml', '.github/scripts/activity.py']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gerar estatísticas públicas
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/activity.py
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: kauebrpe
          outputs: |
            dist/contributions.svg?color_snake=%2339FF14&color_dots=%23232f2a,%231b4930,%232d7142,%234b9b55,%2389c986
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: calendar
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: calendar
          path: generated
      - name: Publicar os SVGs na branch de origem
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          for image in activity contributions; do
            test -s "generated/$image.svg"
            cp "generated/$image.svg" "assets/$image.svg"
          done
          git add -- assets/activity.svg assets/contributions.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualiza atividade pública do perfil'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
